name: Soccer Digest

on:
  schedule:
    # Runs twice a day: 07:00 UTC and 19:00 UTC. Adjust to taste
    # (cron uses UTC — e.g. for 8am/8pm ET use "0 12,0 * * *").
    - cron: "0 7 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}   # optional; defaults to smtp.gmail.com in the script
          SMTP_PORT: ${{ vars.SMTP_PORT }}   # optional; defaults to 587 in the script
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/soccer_digest.py
